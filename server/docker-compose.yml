services:
  a2-content:
    build: .
    container_name: a2_content
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8787
      DATA_DIR: /app/data
    ports:
      - "127.0.0.1:8787:8787"
      - "0.0.0.0:8094:8787"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
