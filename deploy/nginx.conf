server {
    listen 443 ssl http2;
    server_name a2.example.com;

    # Configure your existing certificate paths here.
    ssl_certificate /etc/letsencrypt/live/a2.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/a2.example.com/privkey.pem;

    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
